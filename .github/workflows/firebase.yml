name: Firebase security rules
on:
  push:
    paths: ['firebase/**', 'firebase.json', '.github/workflows/firebase.yml']
  pull_request:
    paths: ['firebase/**', 'firebase.json', '.github/workflows/firebase.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: firebase
      - run: npm test
        working-directory: firebase
